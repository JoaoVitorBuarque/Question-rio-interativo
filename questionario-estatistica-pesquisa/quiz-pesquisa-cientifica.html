<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Iniciação de Pesquisa Científica</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --card: #1e2133;
    --card2: #252840;
    --accent: #22c55e;
    --accent2: #4ade80;
    --purple: #6c63ff;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e6ff;
    --muted: #8890b0;
    --border: #2e3254;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Fundo decorativo */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; right: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(108,99,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.35);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px; font-weight: 600;
    color: var(--accent2);
    margin-bottom: 18px;
    letter-spacing: 0.03em;
  }
  .header h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 800;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 60%, #bbf7d0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .header p { color: var(--muted); font-size: 15px; }

  /* ── PROGRESSO ── */
  .progress-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .progress-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .progress-label { font-size: 13px; color: var(--muted); }
  .progress-pct { font-size: 15px; font-weight: 700; color: var(--accent2); }
  .progress-bar-bg {
    height: 8px; border-radius: 999px;
    background: rgba(34,197,94,0.15);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #16a34a, #22c55e);
    transition: width 0.5s ease;
    width: 0%;
  }

  /* ── PILLS ── */
  .pills { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
  }
  .pill-correct { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  .pill-wrong   { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .pill-remain  { background: rgba(34,197,94,0.12); color: var(--accent2); border: 1px solid rgba(34,197,94,0.25); }

  /* ── FILTROS ── */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .filter-btn {
    padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .filter-btn.active {
    background: rgba(34,197,94,0.2);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #16a34a, #22c55e);
    border-radius: 16px 16px 0 0;
    transition: background 0.3s;
  }
  .card.answered-correct { border-color: rgba(34,197,94,0.5); }
  .card.answered-correct::before { background: linear-gradient(90deg, #16a34a, #22c55e); }
  .card.answered-wrong   { border-color: rgba(239,68,68,0.5); }
  .card.answered-wrong::before   { background: linear-gradient(90deg, #b91c1c, #ef4444); }

  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .q-num {
    background: rgba(34,197,94,0.25);
    color: var(--accent2);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .q-topic {
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .ctx-block {
    background: rgba(34,197,94,0.07);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13.5px;
    color: #b0b8d8;
    line-height: 1.65;
  }

  .q-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 20px;
    font-weight: 400;
  }

  /* ── ALTERNATIVAS ── */
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #ffffff !important;
    text-align: left;
    width: 100%;
    transition: all 0.18s;
    line-height: 1.5;
  }
  .opt span   { color: #ffffff !important; }
  .opt .lt    { color: #ffffff !important; }
  .opt:disabled { color: #ffffff !important; cursor: default; }
  .opt.correct  { color: #ffffff !important; }
  .opt.wrong    { color: #ffffff !important; }

  .opt:not(:disabled):hover {
    transform: translateX(3px);
    background: rgba(34,197,94,0.12);
    border-color: rgba(34,197,94,0.4);
    color: #ffffff !important;
  }
  .lt {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 6px;
    background: rgba(34,197,94,0.2);
    color: #ffffff !important;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .opt.correct {
    background: rgba(34,197,94,0.15) !important;
    border-color: rgba(34,197,94,0.5) !important;
    color: #ffffff !important;
    animation: pulse 0.5s ease;
  }
  .opt.correct .lt {
    background: rgba(34,197,94,0.35);
    color: #ffffff !important;
  }
  .opt.wrong {
    background: rgba(239,68,68,0.15) !important;
    border-color: rgba(239,68,68,0.5) !important;
    color: #ffffff !important;
    animation: shake 0.4s ease;
  }
  .opt.wrong .lt {
    background: rgba(239,68,68,0.35);
    color: #ffffff !important;
  }
  .opt:disabled:not(.correct):not(.wrong) {
    opacity: 0.5;
    color: #ffffff !important;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }

  /* ── FEEDBACK ── */
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.fb-correct {
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.35);
    color: #86efac;
  }
  .feedback.fb-wrong {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
  }

  /* ── RESULTADO FINAL ── */
  #result-screen {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 32px;
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  #result-screen::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #16a34a, #86efac, #16a34a);
  }
  .result-emoji { font-size: 64px; margin-bottom: 12px; }
  .result-pct {
    font-size: clamp(48px, 10vw, 72px);
    font-weight: 800;
    background: linear-gradient(135deg, #fff, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 10px;
  }
  .result-msg { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
  .result-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .result-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    min-width: 120px;
  }
  .result-card-num { font-size: 32px; font-weight: 800; }
  .result-card-num.green { color: var(--green); }
  .result-card-num.red   { color: var(--red); }
  .result-card-num.blue  { color: var(--accent2); }
  .result-card-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btn-retry {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #fff;
    border: none; border-radius: 10px;
    padding: 14px 32px;
    font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  .btn-retry:hover { opacity: 0.9; transform: translateY(-1px); }

  /* ── FAB ── */
  #fab {
    position: fixed; bottom: 28px; right: 24px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    border: none; cursor: pointer;
    color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(34,197,94,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.2s;
    z-index: 100;
  }
  #fab.visible { opacity: 1; pointer-events: all; }
  #fab:hover { transform: scale(1.1); }

  /* ── CODE BLOCK ── */
  .code-block {
    background: #0d1117;
    border: 1px solid #2d3250;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    color: #a9b1d6;
    line-height: 1.6;
    margin-bottom: 14px;
    overflow-x: auto;
    white-space: pre;
  }

  @media (max-width: 600px) {
    .card { padding: 20px 16px; }
    .result-cards { gap: 10px; }
    .result-card { padding: 16px 20px; }
  }
</style>
</head>
<body>

<div class="wrap" id="top">

  <!-- HEADER -->
  <div class="header">
    <div class="badge">🔬 Iniciação de Pesquisa Científica</div>
    <h1>Questionário de Revisão</h1>
    <p id="subtitle"><span id="q-total-label">53</span> questões • Metodologia científica, normas de pesquisa e produção acadêmica</p>
  </div>

  <!-- PROGRESSO -->
  <div class="progress-box">
    <div class="progress-top">
      <span class="progress-label" id="prog-text">0 de 35 respondidas</span>
      <span class="progress-pct" id="prog-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="prog-bar"></div>
    </div>
  </div>

  <!-- PILLS -->
  <div class="pills">
    <span class="pill pill-correct">✅ Corretas: <b id="cnt-c">0</b></span>
    <span class="pill pill-wrong">❌ Erradas: <b id="cnt-w">0</b></span>
    <span class="pill pill-remain">⏳ Restantes: <b id="cnt-r">35</b></span>
  </div>

  <!-- FILTROS -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Todas</button>
    <button class="filter-btn" data-filter="unanswered">Não respondidas</button>
    <button class="filter-btn" data-filter="correct">Corretas</button>
    <button class="filter-btn" data-filter="wrong">Erradas</button>
  </div>

  <!-- RESULTADO FINAL -->
  <div id="result-screen">
    <div class="result-emoji" id="res-emoji">🏆</div>
    <div class="result-pct" id="res-pct">0%</div>
    <div class="result-msg" id="res-msg"></div>
    <div class="result-cards">
      <div class="result-card">
        <div class="result-card-num green" id="res-c">0</div>
        <div class="result-card-lbl">Corretas</div>
      </div>
      <div class="result-card">
        <div class="result-card-num red" id="res-w">0</div>
        <div class="result-card-lbl">Erradas</div>
      </div>
      <div class="result-card">
        <div class="result-card-num blue" id="res-total">53</div>
        <div class="result-card-lbl">Total</div>
      </div>
    </div>
    <button class="btn-retry" onclick="resetQuiz()">🔄 Refazer Questionário</button>
  </div>

  <!-- QUESTÕES -->
  <div id="questions-container"></div>

</div>

<!-- FAB -->
<button id="fab" title="Voltar ao topo" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ─────────────────────────────────────────────────────────────
// BANCO DE QUESTÕES — INICIAÇÃO DE PESQUISA CIENTÍFICA
// Formato padrão de cada item:
// {
//   n: 1,
//   tp: "Tópico / Unidade",
//   ctx: "Texto base ou contextualização da questão (opcional)",
//   q: "Enunciado da pergunta",
//   opts: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D", "Alternativa E"],
//   ans: 0, // Índice da alternativa correta (0 = A, 1 = B, 2 = C, 3 = D, 4 = E)
//   explanation: "Explicação detalhada da resposta correta."
// }
// ─────────────────────────────────────────────────────────────
const Q = [
  {
    "n": 1,
    "tp": "Metodologia de Leitura Acadêmica",
    "code": "",
    "ctx": "A leitura é uma habilidade essencial para pesquisadores iniciantes, permitindo a aquisição de conhecimento, ampliação da compreensão do mundo e aprimoramento do pensamento crítico. No entanto, muitos ainda não exploram todo o potencial dessa habilidade, pois não dominam a arte de ler de maneira eficiente e com propósito. (Disponível em: https://pesquisatec.com/blog/lendo-com-proposito, Acesso 11 jun. 2023).",
    "q": "Na leitura de textos acadêmicos, o nível de leitura mais complexo é o de:",
    "opts": [
      "leitura elementar.",
      "leitura analítica.",
      "leitura sintópica.",
      "leitura crítica.",
      "leitura inspecional."
    ],
    "ans": 2,
    "explanation": "De acordo com Mortimer Adler em 'Como Ler Livros' (obra de referência clássica em metodologia de leitura), existem 4 níveis fundamentais de leitura: elementar, inspecional, analítica e sintópica. O nível mais elevado e complexo é a leitura sintópica (ou comparativa), na qual o leitor analisa múltiplos textos e autores sobre o mesmo tema, articulando conceitos e construindo uma visão abrangente que vai além de qualquer obra isolada.",
    "sources": [
      "Exercicios questionarios Iniciação a Pesquisa Científica.pdf (Pág 1)",
      "Iniciação a Pesquisa Científica, atividades 1 e 3.pdf (Pág 3 - Pergunta 4)"
    ]
  },
  {
    "n": 2,
    "tp": "Epistemologia e Método Cartesiano",
    "code": "",
    "ctx": "Para investigar a verdade, o filósofo francês René Descartes (1596-1650) elaborou um método para orientar sua razão. Toda sua filosofia é construída com o auxílio desse método, desde a descrição de um arco-íris até admitir o movimento da terra e tentar demonstrar a existência de Deus e da alma de forma racional. (Disponível em: https://www.netmundi.org/filosofia/2012/o-metodo-de-descartes/, Acesso em 11 jun. 2023).",
    "q": "Qual das seguintes afirmações é verdadeira sobre o método de Descartes?",
    "opts": [
      "O método de Descartes consiste em começar pelos textos mais complexos e depois avançar para os mais simples.",
      "O método de Descartes pode ser adaptado e ainda é útil para auxiliar na organização de leituras especializadas.",
      "O método de Descartes é essencialmente baseado no racionalismo e não considera o empirismo.",
      "O método de Descartes é uma abordagem ultrapassada e não tem relevância atual.",
      "O método de Descartes é adequado apenas para pesquisadores iniciantes."
    ],
    "ans": 1,
    "explanation": "As quatro regras fundamentais do método cartesiano (evidência, divisão/análise, ordem/síntese e enumeração/revisão) continuam plenamente válidas e aplicáveis na prática acadêmica contemporânea para organizar, decompor e estruturar com clareza a leitura e a escrita científica especializada.",
    "sources": [
      "Exercicios questionarios Iniciação a Pesquisa Científica.pdf (Pág 2)"
    ]
  },
  {
    "n": 3,
    "tp": "Ato de Ler e Consciência Crítica",
    "code": "",
    "ctx": "Me parece indispensável, ao procurar falar de tal importância, dizer algo do momento mesmo em que me preparava para aqui estar hoje; dizer algo do processo em que me inseri enquanto ia escrevendo este texto que agora leio, processo que envolvia uma compreensão crítica do ato de ler, que não se esgota na decodificação pura da palavra escrita ou da linguagem escrita, mas que se antecipa e se alonga na inteligência do mundo. (FREIRE, P. A Importância do ato de ler: em três artigos que se completam (1981). São Paulo: Cortez Editora, p. 9, 2021).",
    "q": "Considere as seguintes afirmativas:\n\nI. A leitura ativa limita as pessoas em seus próprios mundos.\nII. O ato de ler não se limita à mera decodificação de palavras.\nIII. A decodificação de palavras depende da leitura crítica.\nIV. A compreensão crítica do ato de ler se antecipa e se alonga na inteligência do mundo.\n\nDe acordo com o texto, é correto o que se afirma apenas em:",
    "opts": [
      "I e II, apenas.",
      "II e III, apenas.",
      "II e IV, apenas.",
      "III e IV, apenas.",
      "I e III, apenas."
    ],
    "ans": 2,
    "explanation": "Segundo Paulo Freire, 'a leitura do mundo precede a leitura da palavra'. O ato de ler não se esgota na simples decodificação mecânica da linguagem escrita (afirmativa II verdadeira) e prolonga-se na inteligência do mundo e na compreensão da realidade vivida (afirmativa IV verdadeira). As afirmativas I e III deturpam o pensamento freiriano.",
    "sources": [
      "Exercicios questionarios Iniciação a Pesquisa Científica.pdf (Pág 3)",
      "Iniciação a Pesquisa Científica, atividades 1 e 3.pdf (Pág 2 - Pergunta 2)",
      "WhatsApp Image 2026-09-08 at 18.15.01 (3).jpeg"
    ]
  },
  {
    "n": 4,
    "tp": "Teoria do Conhecimento (Problema de Gettier)",
    "code": "",
    "ctx": "Gettier mostra que mesmo um agente tendo uma crença verdadeira e justificada, a sorte ainda pode desempenhar um papel fundamental, tornando intuitivamente inviável atribuirmos a ele conhecimento pelo seu sucesso cognitivo. (Disponível em: https://www.redalyc.org/journal/5766/576674496018/html/, Acesso em: 06 jun. 2023).",
    "q": "O que objetivava o desafio proposto por Edmund Gettier à definição tradicional de conhecimento?",
    "opts": [
      "Mostrar que a definição tradicional é insuficientemente ampla.",
      "Investigar as questões epistemológicas mais fundamentais.",
      "Oferecer uma justificação adequada para uma crença verdadeira.",
      "Discutir os problemas e discussões da natureza do conhecimento.",
      "Apresentar contraexemplos à definição tradicional de conhecimento."
    ],
    "ans": 4,
    "explanation": "No célebre artigo de 1963 ('Is Justified True Belief Knowledge?'), Edmund Gettier elaborou contraexemplos demonstrando casos em que um indivíduo possui uma crença que é simultaneamente verdadeira e justificada, mas apenas por coincidência ou sorte epistêmica, provando que a definição tradicional tripartite (crença verdadeira justificada) não é suficiente para caracterizar o conhecimento autêntico.",
    "sources": [
      "Exercicios questionarios Iniciação a Pesquisa Científica.pdf (Pág 4)",
      "WhatsApp Image 2026-09-08 at 18.15.01 (2).jpeg"
    ]
  },
  {
    "n": 5,

let state = [];
let currentFilter = 'all';

// ── Construir Interface ──
function buildQuiz() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  state = Q.map(() => null);

  const totalLabel = document.getElementById('q-total-label');
  if (totalLabel) totalLabel.textContent = Q.length;

  const resTotal = document.getElementById('res-total');
  if (resTotal) resTotal.textContent = Q.length;

  if (Q.length === 0) {
    container.innerHTML = `
      <div class="card" style="text-align: center; padding: 48px 24px;">
        <div style="font-size: 40px; margin-bottom: 16px;">📑</div>
        <h3 style="font-size: 20px; margin-bottom: 8px;">Aguardando Perguntas</h3>
        <p style="color: var(--muted); font-size: 14px;">Envie as questões de Iniciação de Pesquisa Científica para que sejam adicionadas a este questionário.</p>
      </div>
    `;
    updateCounters();
    return;
  }

  Q.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${i}`;

    let ctxHTML = '';
    if (q.ctx) {
      ctxHTML = `<div class="ctx-block">${q.ctx.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}</div>`;
    }

    const optsHTML = q.opts.map((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      return `<button class="opt" data-qi="${i}" data-oi="${oi}" onclick="answer(${i},${oi})">
        <span class="lt">${letter}</span>
        <span>${escHtml(opt)}</span>
      </button>`;
    }).join('');

    card.innerHTML = `
      <div class="card-header">
        <span class="q-num">Questão ${q.n || (i + 1)}</span>
        <span class="q-topic">${q.tp || 'Pesquisa Científica'}</span>
      </div>
      ${ctxHTML}
      <div class="q-text">${q.q.replace(/\n/g,'<br>')}</div>
      <div class="opts" id="opts-${i}">${optsHTML}</div>
      <div class="feedback" id="fb-${i}"></div>
    `;

    container.appendChild(card);
  });

  updateCounters();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Responder ──
function answer(qi, oi) {
  if (state[qi] !== null) return;

  const q = Q[qi];
  const correct = oi === q.ans;
  state[qi] = correct ? 'correct' : 'wrong';

  const card = document.getElementById(`card-${qi}`);
  const optsContainer = document.getElementById(`opts-${qi}`);
  const fb = document.getElementById(`fb-${qi}`);
  const buttons = optsContainer.querySelectorAll('.opt');

  // Desabilita opções
  buttons.forEach(b => b.disabled = true);

  // Destaca a escolhida e a correta
  buttons[oi].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    buttons[q.ans].classList.add('correct');
  }

  // Borda do Card
  card.classList.add(correct ? 'answered-correct' : 'answered-wrong');

  // Feedback explicativo
  fb.classList.add('show');
  if (correct) {
    fb.classList.add('fb-correct');
    fb.innerHTML = '✅ <strong>Parabéns! Resposta correta!</strong>' + (q.explanation ? `<br><span style="margin-top: 6px; display: inline-block;">${escHtml(q.explanation)}</span>` : '');
  } else {
    const chosenLetter = String.fromCharCode(65 + oi);
    const correctLetter = String.fromCharCode(65 + q.ans);
    fb.classList.add('fb-wrong');
    fb.innerHTML = `❌ <strong>Incorreto.</strong> A alternativa ${chosenLetter}) está errada. A correta é <strong>${correctLetter}) ${escHtml(q.opts[q.ans])}</strong>${q.explanation ? ` — ${escHtml(q.explanation)}` : ''}`;
  }

  updateCounters();
  checkFinished();
  applyFilter(currentFilter);
}

// ── Contadores ──
function updateCounters() {
  const total = Q.length;
  const answered = state.filter(s => s !== null).length;
  const correct  = state.filter(s => s === 'correct').length;
  const wrong    = state.filter(s => s === 'wrong').length;
  const remain   = total - answered;
  const pct      = total > 0 ? Math.round((answered / total) * 100) : 0;

  document.getElementById('prog-text').textContent = `${answered} de ${total} respondidas`;
  document.getElementById('prog-pct').textContent  = `${pct}%`;
  document.getElementById('prog-bar').style.width  = `${pct}%`;
  document.getElementById('cnt-c').textContent = correct;
  document.getElementById('cnt-w').textContent = wrong;
  document.getElementById('cnt-r').textContent = remain;
}

// ── Resultado Final ──
function checkFinished() {
  if (Q.length > 0 && state.every(s => s !== null)) {
    setTimeout(() => {
      const correct = state.filter(s => s === 'correct').length;
      const wrong   = state.filter(s => s === 'wrong').length;
      const pct     = Math.round((correct / Q.length) * 100);
      let emoji = '😔', msg = 'Continue praticando! Você vai melhorar.';
      if (pct >= 90) { emoji = '🏆'; msg = 'Excelente! Desempenho excepcional!'; }
      else if (pct >= 75) { emoji = '🎉'; msg = 'Muito bem! Ótimo desempenho!'; }
      else if (pct >= 60) { emoji = '👍'; msg = 'Bom trabalho! Mas há espaço para melhorar.'; }
      else if (pct >= 40) { emoji = '📚'; msg = 'Revise os conteúdos e tente novamente.'; }

      document.getElementById('res-emoji').textContent = emoji;
      document.getElementById('res-pct').textContent   = `${pct}%`;
      document.getElementById('res-msg').textContent   = msg;
      document.getElementById('res-c').textContent     = correct;
      document.getElementById('res-w').textContent     = wrong;

      const rs = document.getElementById('result-screen');
      rs.style.display = 'block';
      rs.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 1200);
  }
}

// ── Reset ──
function resetQuiz() {
  state = Q.map(() => null);
  document.getElementById('result-screen').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setFilter('all');
}

// ── Filtros ──
function applyFilter(f) {
  Q.forEach((_, i) => {
    const card = document.getElementById(`card-${i}`);
    if (!card) return;
    let show = true;
    if (f === 'unanswered') show = state[i] === null;
    else if (f === 'correct')    show = state[i] === 'correct';
    else if (f === 'wrong')      show = state[i] === 'wrong';
    card.style.display = show ? '' : 'none';
  });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  applyFilter(f);
}

document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => setFilter(b.dataset.filter));
});

// ── FAB ──
window.addEventListener('scroll', () => {
  document.getElementById('fab').classList.toggle('visible', window.scrollY > 400);
});

// ── Init ──
buildQuiz();
</script>
</body>
